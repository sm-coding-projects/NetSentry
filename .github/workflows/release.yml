name: release

# Builds an installable NetSentry DMG and publishes it as a GitHub Release.
#
# Trigger: push a version tag (e.g. `v0.1.0`), or run manually from the Actions tab.
#   git tag v0.1.0 && git push origin v0.1.0
#
# By default this produces an ad-hoc-signed, NON-notarized arm64 DMG (no Apple Developer certificate
# required). Recipients clear Gatekeeper on first launch (see the README). To ship a signed, notarized
# build instead, follow docs/release.md on a machine with a Developer ID certificate, or extend this
# workflow to import the certificate and call Scripts/build-release.sh with --team-id/--identity.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build (e.g. 0.1.0)"
        required: true
        default: "0.1.0"

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Pin the same Xcode the project is developed against (26.6). The runner's "latest-stable"
      # can resolve to an older Xcode (e.g. 26.3) whose stricter Swift 6 concurrency checking rejects
      # code that builds cleanly on 26.6. build-release.sh honours DEVELOPER_DIR.
      - name: Select Xcode 26.6
        run: |
          APP=$(ls -d /Applications/Xcode_26.6*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$APP" ]; then
            echo "Xcode 26.6 not found on this runner. Available:"; ls -d /Applications/Xcode_*.app; exit 1
          fi
          echo "DEVELOPER_DIR=$APP/Contents/Developer" >> "$GITHUB_ENV"
          "$APP/Contents/Developer/usr/bin/xcodebuild" -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Resolve version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building NetSentry $VERSION"

      - name: Build ad-hoc DMG
        run: |
          Scripts/build-release.sh --adhoc \
            --version "${{ steps.version.outputs.version }}" \
            --build "${{ github.run_number }}"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: NetSentry-${{ steps.version.outputs.version }}-dmg
          path: |
            build/release/NetSentry-*.dmg
            build/release/NetSentry-*.dmg.sha256

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: NetSentry ${{ steps.version.outputs.version }}
          generate_release_notes: true
          body: |
            Ad-hoc-signed (not notarized) Apple Silicon build.

            **First launch:** right-click NetSentry → Open, or run
            `xattr -dr com.apple.quarantine /Applications/NetSentry.app`. See the README for setup.
          files: |
            build/release/NetSentry-*.dmg
            build/release/NetSentry-*.dmg.sha256
