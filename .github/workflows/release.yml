name: release

# Builds an installable NetSentry DMG and publishes it as a GitHub Release when a version tag is pushed.
#
#   git tag v0.2.0 && git push origin v0.2.0
#
# NetSentry builds with Xcode 26.6 (stricter/older Xcode rejects Swift 6 concurrency that 26.6 accepts).
# GitHub-hosted runners do not ship Xcode 26.6 yet, so this workflow's build job SKIPS (it does not fail)
# on runners without it — cut releases locally with `Scripts/publish-release.sh --version <x>` in the
# meantime. Once the runners provide Xcode 26.6, tagged releases build and publish here automatically.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build (e.g. 0.2.0)"
        required: true
        default: "0.0.0"

permissions:
  contents: write

jobs:
  # Detect the required toolchain up front so the build job can skip cleanly when it is unavailable.
  toolchain:
    runs-on: macos-15
    outputs:
      xcode: ${{ steps.find.outputs.path }}
      available: ${{ steps.find.outputs.available }}
    steps:
      - id: find
        run: |
          APP=$(ls -d /Applications/Xcode_26.6*.app 2>/dev/null | sort -V | tail -1 || true)
          if [ -n "$APP" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "path=$APP" >> "$GITHUB_OUTPUT"
            echo "Found required toolchain: $APP"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Xcode 26.6 is not on this runner yet — skipping the CI build."
            echo "::notice::Cut the release locally: Scripts/publish-release.sh --version <x>"
          fi

  build:
    needs: toolchain
    if: needs.toolchain.outputs.available == 'true'
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 26.6
        run: echo "DEVELOPER_DIR=${{ needs.toolchain.outputs.xcode }}/Contents/Developer" >> "$GITHUB_ENV"

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Resolve version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build ad-hoc DMG
        run: |
          Scripts/build-release.sh --adhoc \
            --version "${{ steps.version.outputs.version }}" \
            --build "${{ github.run_number }}"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: NetSentry-${{ steps.version.outputs.version }}-dmg
          path: |
            build/release/NetSentry-*.dmg
            build/release/NetSentry-*.dmg.sha256

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: NetSentry ${{ steps.version.outputs.version }}
          generate_release_notes: true
          body: |
            Ad-hoc-signed (not notarized) universal build.

            **First launch:** right-click NetSentry → Open, or run
            `xattr -dr com.apple.quarantine /Applications/NetSentry.app`. See the README for setup.
          files: |
            build/release/NetSentry-*.dmg
            build/release/NetSentry-*.dmg.sha256
